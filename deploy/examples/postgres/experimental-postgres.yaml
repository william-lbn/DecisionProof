apiVersion: v1
kind: ConfigMap
metadata:
  name: decisionproof-postgres-init
data:
  01-app-role.sh: |
    #!/bin/sh
    set -eu
    psql --set ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      --set app_user="$APP_USER" --set app_password="$APP_PASSWORD" <<'EOSQL'
    SELECT format(
      'CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT',
      :'app_user', :'app_password'
    )
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
    SELECT format('GRANT CONNECT ON DATABASE %I TO %I', current_database(), :'app_user') \gexec
    SELECT format('GRANT USAGE ON SCHEMA public TO %I', :'app_user') \gexec
    SELECT format(
      'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I',
      current_user, :'app_user'
    ) \gexec
    SELECT format(
      'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO %I',
      current_user, :'app_user'
    ) \gexec
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: decisionproof-postgres
spec:
  selector:
    app.kubernetes.io/name: decisionproof-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: decisionproof-postgres
spec:
  serviceName: decisionproof-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: decisionproof-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: decisionproof-postgres
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: docker-desktop
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # 本地实验也绑定真实 Registry Digest，避免把可变标签作为数据库版本身份。
          image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: decisionproof
            - name: POSTGRES_USER
              value: decisionproof_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: decisionproof-postgres-bootstrap
                  key: admin-password
            - name: APP_USER
              value: decisionproof_app
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: decisionproof-postgres-bootstrap
                  key: app-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-app-role.sh
              subPath: 01-app-role.sh
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: decisionproof-postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
