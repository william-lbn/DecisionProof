openapi: 3.1.0
info:
  title: DecisionProof Control API
  version: 0.3.0
  description: |
    产品决策到生产结果的可信闭环平台 API。
    当前开发模式使用身份头；生产环境必须由 GitLab OAuth/OIDC 或可信网关注入身份。
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: 进程存活检查
      responses:
        '200': {description: 正常}
  /readyz:
    get:
      summary: 运行时依赖就绪检查
      description: PostgreSQL 不可用时 Fail-closed 返回 503；Kubernetes Readiness Probe 使用此接口。
      responses:
        '200': {description: 运行时依赖已就绪}
        '503': {description: 数据库或必需依赖不可用}
  /product/v1/documents:
    post:
      summary: 上传并解析产品资料
      description: 支持 Markdown、TXT、DOCX 和 PPTX；PDF 当前需要外部解析器。
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [project_id, file]
              properties:
                project_id: {type: string}
                file: {type: string, format: binary}
      responses:
        '201': {description: 已保存原始资料和来源块}
        '415': {description: 不支持的格式}
  /product/v1/documents/{document_id}/extract:
    post:
      summary: 从资料中提取结构化产品决策
      parameters:
        - $ref: '#/components/parameters/DocumentID'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ActorHeader'
      responses:
        '201': {description: 已生成 EXTRACTED/SUGGESTED 决策}
  /product/v1/decisions:
    get:
      summary: 查询项目产品决策
      parameters:
        - in: query
          name: project_id
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200': {description: 决策列表}
    post:
      summary: 人工创建产品决策
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, kind, title, content]
              additionalProperties: false
              properties:
                project_id: {type: string}
                kind: {type: string}
                title: {type: string}
                content: {type: string}
      responses:
        '201': {description: 已创建人工决策}
        '422': {description: 决策类型或内容无效}
  /product/v1/decisions/{decision_id}:
    patch:
      summary: 修订产品决策并使旧批准失效
      parameters:
        - $ref: '#/components/parameters/DecisionID'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content, version]
              additionalProperties: false
              properties:
                title: {type: string}
                content: {type: string}
                version: {type: integer, minimum: 1}
      responses:
        '200': {description: 已生成新修订}
        '409': {description: 版本冲突}
  /product/v1/decisions/{decision_id}/confirm:
    post:
      summary: 人工确认提取结果
      parameters:
        - $ref: '#/components/parameters/DecisionID'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, minimum: 1}
      responses:
        '200': {description: 已确认}
        '409': {description: 版本冲突}
  /product/v1/decisions/{decision_id}/approve:
    post:
      summary: 授权人批准产品决策
      parameters:
        - $ref: '#/components/parameters/DecisionID'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, minimum: 1}
      responses:
        '200': {description: 已批准}
        '409': {description: 当前状态、版本或职责分离不允许批准}
  /product/v1/decisions/{decision_id}/reject:
    post:
      summary: 否决产品决策
      parameters:
        - $ref: '#/components/parameters/DecisionID'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              additionalProperties: false
              properties:
                version: {type: integer, minimum: 1}
                reason: {type: string, minLength: 1}
      responses:
        '200': {description: 已否决}
        '409': {description: 版本冲突或当前状态不允许否决}
  /product/v1/engineering-packages:
    post:
      summary: 生成工程就绪包
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: {type: string}
      responses:
        '201': {description: 已生成工程就绪包}
        '422': {description: 缺少已批准的必要产品对象}
  /product/v1/engineering-packages/{package_id}/gitlab-bundle:
    get:
      summary: 把工程就绪包确定性渲染为 GitLab Issue 和 Docs-as-Code 文件
      parameters:
        - $ref: '#/components/parameters/PackageID'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ActorHeader'
      responses:
        '200': {description: GitLab 工程交付 Bundle}
        '404': {description: 工程就绪包不存在}
  /webhooks/gitlab:
    post:
      summary: GitLab Webhook Inbox 接收
      description: 使用 Webhook-Signature HMAC 或兼容的 X-Gitlab-Token 校验，按 Integration 和 Event UUID 幂等写入租户隔离 Inbox 后立即返回 202。
      responses:
        '202': {description: 已接收或识别为重复事件}
        '401': {description: 签名无效}
        '413': {description: 请求体过大}
  /v1/changes:
    post:
      summary: 创建工程变更
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ActorHeader'
        - $ref: '#/components/parameters/RolesHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, title]
              additionalProperties: false
              properties:
                project_id: {type: string}
                title: {type: string}
                description: {type: string}
                risk_level: {type: string, enum: [low, medium, high]}
      responses:
        '201': {description: 已创建}
  /v1/changes/{change_id}:
    get:
      summary: 查询工程变更
      parameters:
        - $ref: '#/components/parameters/ChangeID'
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200': {description: 变更对象}
  /v1/changes/{change_id}/evidence:
    post:
      summary: 写入不可变证据 V2
      parameters:
        - $ref: '#/components/parameters/ChangeID'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, verdict, payload]
              properties:
                type: {type: string}
                schema_version: {type: string}
                verdict: {type: string, enum: [PASS, FAIL, INCONCLUSIVE, OBSERVED]}
                trust_class: {type: string}
                subject_type: {type: string}
                subject_id: {type: string}
                subject_digest: {type: string}
                source_system: {type: string}
                source_uri: {type: string}
                external_id: {type: string}
                payload: {type: object}
      responses:
        '201': {description: 已写入}
    get:
      summary: 查询变更证据链
      parameters:
        - $ref: '#/components/parameters/ChangeID'
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200': {description: 证据列表}
  /v1/changes/{change_id}/transitions:
    post:
      summary: 请求证据条件状态迁移
      parameters:
        - $ref: '#/components/parameters/ChangeID'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, idempotency_key]
              properties:
                target: {type: string}
                idempotency_key: {type: string}
      responses:
        '200': {description: 迁移成功或幂等返回}
        '422': {description: 策略或证据不满足}
  /v1/actions:
    post:
      summary: 提交受控外部动作
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ActorHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [change_id, intent, target, idempotency_key]
              properties:
                change_id: {type: string}
                intent: {type: string}
                target: {type: string}
                risk_level: {type: string}
                parameters: {type: object}
                idempotency_key: {type: string}
                expected_effects: {type: array, items: {type: string}}
                forbidden_effects: {type: array, items: {type: string}}
                preconditions: {type: array, items: {type: string}}
      responses:
        '202': {description: 已结算或进入 UNKNOWN 等待对账}
components:
  parameters:
    ChangeID:
      in: path
      name: change_id
      required: true
      schema: {type: string}
    DocumentID:
      in: path
      name: document_id
      required: true
      schema: {type: string}
    DecisionID:
      in: path
      name: decision_id
      required: true
      schema: {type: string}
    PackageID:
      in: path
      name: package_id
      required: true
      schema: {type: string}
    TenantHeader:
      in: header
      name: X-Tenant-ID
      required: true
      description: 仅开发模式允许客户端提供；生产必须由可信身份层注入。
      schema: {type: string}
    ActorHeader:
      in: header
      name: X-Actor-ID
      required: true
      schema: {type: string}
    RolesHeader:
      in: header
      name: X-Actor-Roles
      required: false
      schema: {type: string}
